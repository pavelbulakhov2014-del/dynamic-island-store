<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Ключ лицензии — Dynamic Island</title><link rel="stylesheet" href="style.css"></head><body><header class="wrap nav"><a href="/" class="logo">◈ ISLAND / WINDOWS</a></header><main class="wrap receipt"><h1>Спасибо за покупку!</h1><p>Проверяем оплату. Ключ появится после подтверждения Stripe.</p><div class="license" id="result">Проверка заказа…</div><button id="copy" class="btn primary" hidden>Скопировать ключ</button><p class="note">Не передавай адрес этой страницы: он позволяет увидеть ключ.</p><a class="btn ghost" href="/">На главную</a></main><script>
const result=document.querySelector('#result'),copy=document.querySelector('#copy');let key='',attempts=0;const id=new URLSearchParams(location.search).get('session_id');async function check(){if(!id){result.textContent='Нет номера заказа';return;}try{const r=await fetch('/api/order/'+encodeURIComponent(id),{cache:'no-store'});const v=await r.json();if(!r.ok){result.textContent=v.error||'Ошибка';return;}if(v.status==='ready'){key=v.licenseKey;result.textContent=key;copy.hidden=false;return;}result.textContent='Ожидаем выдачу ключа…';if(++attempts<12)setTimeout(check,2500);}catch{result.textContent='Ошибка связи с сервером';}}copy.onclick=async()=>{await navigator.clipboard.writeText(key);copy.textContent='Скопировано ✓';};check();
</script></body></html>
